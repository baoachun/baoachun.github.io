short_bio: >-
  <p>
    I am a fourth-year Ph.D. student at <strong>Shenzhen International Graduate School (SIGS)</strong>,
    Tsinghua University, advised by <a href='https://www.sigs.tsinghua.edu.cn/lx/list.psp' target='_blank' rel='noopener noreferrer'>Prof. Xiu Li</a>.
  </p>
  <p>
    My research focuses on <strong>neural rendering</strong> and <strong>3D computer vision</strong>, with particular interests in:
  </p>
  <ul class="pl-4 mb-0">
    <li class="mb-2"><strong>Neural Rendering:</strong> Neural radiance fields (NeRF) and 3D Gaussian splatting (3DGS).</li>
    <li class="mb-2"><strong>3D Generation:</strong> 3D content generation.</li>
    <li><strong>Avatar Reconstruction:</strong> Reconstruction of 3D avatars.</li>
  </ul>

